<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Reset Password | SkyBlockHaven</title>

<link rel="stylesheet" href="./css/auth.css">
</head>

<body>

<div class="auth-container">

<div class="logo">
⛏️ SkyBlockHaven
</div>

<div class="auth-card">

<h1>🔓 Reset Password</h1>

<p>Enter your username, the code you were given, and a new password.</p>

<form id="resetForm">

<input
type="text"
placeholder="Username"
id="username"
required>

<input
type="text"
placeholder="6-digit code"
id="code"
maxlength="6"
required>

<input
type="password"
placeholder="New password"
id="newPassword"
required>

<input
type="password"
placeholder="Confirm new password"
id="confirmPassword"
required>

<button type="submit">
Reset Password
</button>

</form>

<div class="links">
<a href="forgot-password.html">
Need a new code?
</a>

<a href="login.html">
Back to Login
</a>
</div>

</div>

</div>

<script src="./js/auth.js"></script>
<script src="./js/notifications.js"></script>

<script>
document.getElementById("resetForm").addEventListener("submit", function(e){
    e.preventDefault();
    let username = document.getElementById("username").value.trim();
    let code = document.getElementById("code").value.trim();
    let newPassword = document.getElementById("newPassword").value;
    let confirmPassword = document.getElementById("confirmPassword").value;

    if(newPassword !== confirmPassword){
        alert("Passwords do not match!");
        return;
    }

    let result = resetPassword(username, code, newPassword);
    if(!result.ok){
        alert(result.error);
        return;
    }

    alert("Password reset! You can log in with your new password now.");
    window.location.href = "login.html";
});
</script>

</body>
</html>
