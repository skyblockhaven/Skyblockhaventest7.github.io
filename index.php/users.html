<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Users | SkyBlockHaven</title>
<link rel="icon" href="./site/assets/Skyblockhaven.ico">
<link rel="stylesheet" href="./css/style.css">
</head><body>

<header>
    <div class="logo">⛏️ <span>SkyBlockHaven</span></div>

    <nav>
        <a href="index.html">🏠 Home</a>
        <a href="servers.html">🌐 Servers</a>
        <a href="news.html">📢 News</a>
        <a href="rules.html">📜 Rules</a>
        <a href="applications.html">📝 Applications</a>
        <a href="staff.html">👥 Staff</a>
        <a href="mods.html">🔧 Mods</a>
        <a href="discord.html">💬 Discord</a>
        <a href="forums.html">💬 Forums</a>
        <a href="polls.html">📊 Polls</a>
        <a href="users.html">🗂️ Users</a>
<a href="players.html">🎮 Players</a>
        <div class="auth-area" id="authArea"></div>
    </nav>

    <button class="hamburger" id="hamburgerBtn" aria-label="Toggle menu">☰</button>
</header>

<div class="dashboard">
<h1>🗂️ Users</h1>
<p style="color:#999;margin-bottom:20px;">Every registered SkyBlockHaven account. Click a user to view their public profile.</p>

<div class="toolbar">
    <input type="text" id="searchInput" placeholder="🔍 Search username...">
    <select id="sortSelect">
        <option value="username">Sort: Username (A–Z)</option>
        <option value="rank">Sort: Rank</option>
        <option value="joined_desc">Sort: Newest joined</option>
        <option value="joined_asc">Sort: Oldest joined</option>
        <option value="lastOnline">Sort: Last online</option>
    </select>
    <label class="checkbox-label"><input type="checkbox" id="onlineOnly"> 🟢 Online only</label>
</div>

<p class="result-count" id="resultCount"></p>

<div class="cards" id="userGrid"></div>

<div class="empty-state" id="emptyState" style="display:none;">No users match your search.</div>

<div class="pagination" id="pagination"></div>
</div>

<script src="./js/script.js"></script>
<script src="./js/auth.js"></script>
<script src="./js/notifications.js"></script>
<script>
const PAGE_SIZE = 12;
let page = 1;

const searchInput = document.getElementById("searchInput");
const sortSelect = document.getElementById("sortSelect");
const onlineOnly = document.getElementById("onlineOnly");

function getFilteredUsers(){
    let users = getUsers().filter(u => !u.banned);
    const q = searchInput.value.trim().toLowerCase();
    if(q) users = users.filter(u => u.username.toLowerCase().includes(q));
    if(onlineOnly.checked) users = users.filter(isOnline);

    const sort = sortSelect.value;
    const rankOrder = RANKS;
    if(sort === "username") users.sort((a,b) => a.username.localeCompare(b.username));
    else if(sort === "rank") users.sort((a,b) => rankOrder.indexOf(b.rank) - rankOrder.indexOf(a.rank) || a.username.localeCompare(b.username));
    else if(sort === "joined_desc") users.sort((a,b) => b.joined.localeCompare(a.joined));
    else if(sort === "joined_asc") users.sort((a,b) => a.joined.localeCompare(b.joined));
    else if(sort === "lastOnline") users.sort((a,b) => new Date(b.lastOnline) - new Date(a.lastOnline));

    return users;
}

function cssId(username){ return username.replace(/[^a-zA-Z0-9]/g, "_"); }

function render(){
    const all = getFilteredUsers();
    const totalPages = Math.max(1, Math.ceil(all.length / PAGE_SIZE));
    if(page > totalPages) page = totalPages;
    const slice = all.slice((page - 1) * PAGE_SIZE, page * PAGE_SIZE);

    document.getElementById("resultCount").textContent = `${all.length} user${all.length === 1 ? "" : "s"} found`;

    const grid = document.getElementById("userGrid");
    const empty = document.getElementById("emptyState");
    grid.innerHTML = "";
    empty.style.display = all.length ? "none" : "block";

    slice.forEach(u => {
        const online = isOnline(u);
        grid.innerHTML += `
        <a class="card" href="profile.html?user=${encodeURIComponent(u.username)}" style="text-decoration:none;color:inherit;display:block;">
            <div class="avatar-circle">${avatarHtml(u)}</div>
            <h3>${escapeHtml(u.username)}</h3>
            <p style="margin:8px 0;">${roleBadge(u.role)} ${rankBadge(u.rank)}</p>
            <p class="online-pill"><span class="status-dot ${online ? "active" : "banned"}" style="${online ? "" : "background:#555;box-shadow:none;"}"></span>${online ? "Online" : "Offline"}</p>
            <p style="font-size:11.5px;color:#666;margin-top:8px;">Joined ${u.joined}<br>Last online: ${relativeTime(u.lastOnline)}</p>
        </a>`;
    });

    const pag = document.getElementById("pagination");
    if(totalPages <= 1){ pag.innerHTML = ""; return; }
    pag.innerHTML = `
        <button class="btn-sm" ${page === 1 ? "disabled" : ""} onclick="changePage(${page - 1})">← Prev</button>
        <span>Page ${page} of ${totalPages}</span>
        <button class="btn-sm" ${page === totalPages ? "disabled" : ""} onclick="changePage(${page + 1})">Next →</button>`;
}

function changePage(p){ page = p; render(); }

searchInput.addEventListener("input", () => { page = 1; render(); });
sortSelect.addEventListener("change", () => { page = 1; render(); });
onlineOnly.addEventListener("change", () => { page = 1; render(); });

render();
setInterval(render, 30000); // keep online/offline status fresh
</script>

</body></html>
