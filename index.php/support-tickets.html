<main>
<section class="card">
<h1>🎫 Support Tickets</h1>
<p>Create a ticket for server support, reports, appeals, or suggestions.</p>
<button class="button" id="createTicketBtn">🎫 Create Ticket</button>
<p id="ticketStatus" style="margin-top:10px;"></p>
</section>
</main>
<script src="./js/script.js"></script>
<script src="./js/auth.js"></script>
<script src="./js/notifications.js"></script>
<script>
    document.getElementById("createTicketBtn").addEventListener("click", function(){
        const user = currentUser();
        if(!user){
            window.location.href = "login.html";
            return;
        }
        document.getElementById("ticketStatus").textContent =
            "✅ Ticket submitted by " + user.username + ". Staff will review it soon.";
    });
</script>
