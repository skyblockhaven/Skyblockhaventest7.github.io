<div class="dashboard">
<h1>📜 History Log</h1>
<p style="color:#999;margin-bottom:20px;">Every logged action across the server, most recent first.</p>

<div class="toolbar">
    <input type="text" id="filterInput" placeholder="Filter by username..." style="max-width:260px;">
</div>

<div class="card" style="text-align:left;">
    <div id="logList"></div>
</div>
</div>

<script src="./js/script.js"></script>
<script src="./js/auth.js"></script>
<script src="./js/notifications.js"></script>
<script>
const viewer = requirePermission("view_logs");

function renderLog(filter){
    const log = getGlobalLog();
    const filtered = filter
        ? log.filter(h => h.user.toLowerCase().includes(filter.toLowerCase()))
        : log;

    document.getElementById("logList").innerHTML = filtered.length
        ? filtered.map(h => `
            <div class="history-item">
                <div class="a">${h.user} — ${h.action}${h.detail ? ': ' + h.detail : ''}${h.reason ? ' — ' + h.reason : ''}</div>
                <div class="d">${h.staff ? 'Staff: ' + h.staff + ' · ' : ''}${h.duration ? 'Duration: ' + h.duration + ' · ' : ''}${h.date}</div>
            </div>`).join('')
        : `<p style="color:#666;">No matching history.</p>`;
}

document.getElementById("filterInput").addEventListener("input", (e) => renderLog(e.target.value.trim()));

renderLog("");
</script>

</body></html>
