<p>Live status, pulled from the server itself — not a hardcoded label.</p>

<script>
    renderLiveStatus("liveStatus", serverIP01, false);
    document.getElementById("refreshStatusBtn").addEventListener("click", function(){
        renderLiveStatus("liveStatus", serverIP01, false);
    });
    document.getElementById("serverStatusBtn").addEventListener("click", function(){
        document.getElementById("statusDetails").innerHTML =
            "IP: <strong>" + serverIP01 + "</strong> — click to copy: " +
            "<button class=\"button\" onclick=\"copyIP01()\">📋 Copy IP</button>";
