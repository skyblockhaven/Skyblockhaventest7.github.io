<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Forgot Password | SkyBlockHaven</title>

<link rel="stylesheet" href="./css/auth.css">
</head>

<body>

<div class="auth-container">

<div class="logo">
⛏️ SkyBlockHaven
</div>

<div class="auth-card">

<h1>🔑 Forgot Password</h1>

<p>Enter your username and we'll generate a reset code for you.</p>

<form id="forgotForm">

<input
type="text"
placeholder="Username"
id="username"
required>

<button type="submit">
Send Reset Code
</button>

</form>

<div id="resultBox" style="display:none;margin-top:16px;padding:14px;border:1px solid #30363d;border-radius:8px;background:#0d1117;">
<p style="margin-bottom:10px;color:#ccc;font-size:13px;">This demo site has no email server yet, so here's your code directly — a real launch would email this instead of showing it on screen:</p>
<p style="font-family:'Orbitron',sans-serif;font-size:26px;color:#4cc9ff;letter-spacing:4px;text-align:center;" id="codeDisplay"></p>
<p style="margin-top:10px;color:#888;font-size:11.5px;">Expires in 15 minutes.</p>
</div>

<div class="links">
<a href="reset-password.html">
I have a code
</a>

<a href="login.html">
Back to Login
</a>
</div>

</div>

</div>

<script src="./js/auth.js"></script>
<script src="./js/notifications.js"></script>

<script>
document.getElementById("forgotForm").addEventListener("submit", function(e){
    e.preventDefault();
    let username = document.getElementById("username").value.trim();
    let result = requestPasswordReset(username);
    if(!result.ok){
        alert(result.error);
        return;
    }
    document.getElementById("resultBox").style.display = "block";
    document.getElementById("codeDisplay").textContent = result.code;
});
</script>

</body>
</html>
